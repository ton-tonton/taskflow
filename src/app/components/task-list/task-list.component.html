<section class="flex flex-col w-full">
  <div class="content-center flex gap-sm items-center py-2 mb-4 w-full">
    <h2 class="leading-[1.25] not-italic shrink-0 text-lg text-primary whitespace-nowrap uppercase">
      {{ title() }}
    </h2>
    <div class="flex-1 min-h-px h-px border-t border-solid border-balticsea-100 w-full"></div>
    <p class="font-semibold leading-[1.5] not-italic shrink-0 text-md text-balticsea-100 whitespace-nowrap">
      {{ tasks().length }} {{ tasks().length === 1 ? 'task' : 'tasks' }}
    </p>
  </div>

  <div class="flex flex-col gap-sm">
    @for (task of tasks(); track task.id) {
      <app-task-item
        [task]="task"
        (taskToggle)="onTaskToggle($event)"
        (taskDelete)="onTaskDelete($event)"
      />
    }
  </div>
</section>
