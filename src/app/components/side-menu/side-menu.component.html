<div class="flex flex-col gap-[38px] items-start px-[15px] py-[35px] w-full">
  <!-- Logo -->
  <div class="flex gap-sm items-center leading-[1.25] shrink-0 text-xl text-primary whitespace-nowrap pl-sm">
    <fa-icon [icon]="icons.logo" aria-hidden="true" class="text-xl" />
    <span class="font-base">TaskFlow</span>
  </div>

  <!-- Menu -->
  <nav class="flex flex-col items-start shrink-0 w-full" aria-label="Main Navigation">
    @for (item of menuItems; track item.id) {
      <button
        type="button"
        (click)="navItemClick.emit(item.id)"
        class="
          flex items-center justify-between p-sm relative rounded-md shrink-0 w-full
          transition-colors focus-visible:outline-2 focus-visible:outline-primary
        "
        [class.bg-primary]="activeView() === item.id"
        [class.text-text-inverse]="activeView() === item.id"
        [class.text-text-primary]="activeView() !== item.id"
        [class.hover:bg-springwood-200]="activeView() !== item.id"
        [attr.aria-current]="activeView() === item.id ? 'page' : null"
      >
        <div class="flex flex-[1_0_0] gap-sm items-center min-h-px min-w-px py-sm px-xs text-md">
          <fa-icon [icon]="item.icon" aria-hidden="true" class="shrink-0" />
          <span class="flex-[1_0_0] font-semibold leading-[1.5] text-left">
            {{ item.label }}
          </span>
        </div>

        @if ((navCounts()[item.id] ?? 0) > 0) {
          <div
            class="flex items-center justify-center py-xs px-sm rounded-sm shrink-0 min-w-[40px]"
            [class.bg-bg-default]="activeView() === item.id"
          >
            <span
              class="font-semibold leading-[1.5] text-md whitespace-nowrap"
              [class.text-text-primary]="true"
            >
              {{ navCounts()[item.id] }}
            </span>
          </div>
        }
      </button>
    }
  </nav>
</div>
