<button
  type="button"
  (click)="clicked.emit($event)"
  class="
    flex items-center w-full content-stretch
    gap-sm px-md py-sm
    bg-bg-default border border-dashed border-balticsea-100 rounded-md
    text-balticsea-200 text-md font-base leading-[1.5]
    transition-colors hover:bg-springwood-600 hover:border-balticsea-200
    focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary
  "
>
  <fa-icon [icon]="faPlus" aria-hidden="true" class="shrink-0" />
  <span class="flex-1 text-left leading-[1.5] min-w-0 truncate">
    {{ text() }}
  </span>
</button>
