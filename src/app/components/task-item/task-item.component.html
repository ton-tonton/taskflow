<div
  class="
    bg-bg-default border border-solid content-stretch flex gap-sm items-start
    leading-[1.5] p-md relative rounded-md w-full text-md
    transition-colors duration-200
  "
  [class.border-green-500]="task().completed"
  [class.border-text-primary]="!task().completed"
>
  <div class="shrink-0 flex items-center">
    <app-checkbox
      [checked]="task().completed"
      [ariaLabel]="'Toggle task: ' + task().text"
      (checkedChange)="toggleTask()"
    />
  </div>

  <p
    class="flex-1 font-base min-h-px min-w-px relative transition-colors duration-200 break-words ml-2 flex items-center"
    [class.text-gray-400]="task().completed"
    [class.text-text-primary]="!task().completed"
  >
    <span class="relative">
      {{ task().text }}
      @if (task().completed) {
        <span class="absolute top-1/2 left-0 w-full h-[1px] bg-gray-400 -translate-y-1/2"></span>
      }
    </span>
  </p>

  @if (!task().completed) {
    <button
      type="button"
      class="
        shrink-0 flex items-center justify-center text-red-500 cursor-pointer
        hover:text-red-700 focus-visible:outline focus-visible:outline-2
        focus-visible:outline-offset-2 focus-visible:outline-error
        rounded-sm p-1 -m-1 transition-colors ml-auto
      "
      [attr.aria-label]="'Delete task: ' + task().text"
      (click)="deleteTask()"
    >
      <fa-icon [icon]="faTrash" aria-hidden="true" />
    </button>
  }
</div>
